<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillSwap | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container">
        <a href="index.html" class="logo">SkillSwap</a>
        <div class="nav-actions">
          <button class="theme-toggle" type="button" aria-label="Toggle color theme">
            <span class="theme-toggle__icon">☀️</span>
          </button>
          <a href="signup.html" class="btn btn-sm">Create account</a>
        </div>
      </nav>
    </header>

    <main class="container page-shell auth-shell">
      <section class="auth-card">
        <p class="eyebrow">Welcome back</p>
        <h1>Log into SkillSwap</h1>
        <form class="contact-form auth-form" id="login-form">
          <label>
            Email
            <input type="email" name="email" placeholder="you@example.com" required />
          </label>
          <label>
            Password
            <input type="password" name="password" placeholder="Your password" required />
          </label>
          <button class="btn" type="submit">Login</button>
          <p class="form-status" id="login-status" role="status" aria-live="polite"></p>
        </form>
        <p class="auth-link">New here? <a href="signup.html">Create an account</a></p>
      </section>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
