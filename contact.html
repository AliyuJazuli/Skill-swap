<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillSwap | Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container">
        <a href="index.html" class="logo">SkillSwap</a>

        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="nav-actions">
          <button class="theme-toggle" type="button" aria-label="Toggle color theme">
            <span class="theme-toggle__icon">☀️</span>
          </button>
          <a href="login.html" class="btn btn-sm" data-auth="login">Login</a>
          <a href="signup.html" class="btn btn-sm" data-auth="signup">Sign Up</a>
        </div>
      </nav>
    </header>

    <main class="container page-shell">
      <section class="page-hero">
        <p class="eyebrow">Get in touch</p>
        <h1>Have a question, idea, or issue to report?</h1>
        <p>
          Send us a message below and it'll open right in your email app, addressed to us — no account or extra
          sign-up needed.
        </p>
      </section>

      <section class="search-panel" style="max-width: 640px; margin: 0 auto;">
        <form class="contact-form">
          <label for="contact-name">Name
            <input type="text" id="contact-name" name="name" required autocomplete="name" />
          </label>

          <label for="contact-email">Email
            <input type="email" id="contact-email" name="email" required autocomplete="email" />
          </label>

          <label for="contact-subject">Subject
            <input type="text" id="contact-subject" name="subject" required />
          </label>

          <label for="contact-message">Message
            <textarea id="contact-message" name="message" rows="6" required></textarea>
          </label>

          <button type="submit" class="btn">Send message</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <p>© 2026 SkillSwap. All rights reserved.</p>
        <div class="footer-links">
          <a href="index.html">Home</a>
          <a href="browse.html">Browse</a>
          <a href="contact.html">Contact</a>
        </div>
      </div>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
