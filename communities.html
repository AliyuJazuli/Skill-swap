<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>SkillSwap | Communities</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" /><link rel="stylesheet" href="css/style.css" /></head>
<body><header class="site-header"><nav class="navbar container"><a href="index.html" class="logo">SkillSwap</a><div class="nav-actions"><button class="theme-toggle" type="button" aria-label="Toggle color theme"><span class="theme-toggle__icon">☀️</span></button><a href="dashboard.html" class="btn btn-sm">Dashboard</a></div></nav></header>
<main class="container page-shell"><section class="page-hero"><p class="eyebrow">Learn together</p><h1>Skill communities and study groups.</h1><p>Ask a focused question, share your work, or join a weekly accountability group.</p></section><section class="search-panel"><input id="community-search" class="skill-search" type="search" placeholder="Search communities, mentors, or study groups" /></section><section id="community-list" class="skills-grid"></section><section class="section"><div class="section-heading"><p class="eyebrow">Community discussion</p><h2>Share a question or project update</h2></div><form id="discussion-form" class="contact-form"><label>Choose a community<select id="discussion-skill" name="skill"></select></label><label>Your post<textarea name="post" required maxlength="500" placeholder="Example: I finished my first form. How can I improve the labels and error messages?"></textarea></label><button type="submit" class="btn">Post to community</button><p id="discussion-status" class="form-status" aria-live="polite"></p></form><div id="discussion-list" class="swap-request-list"></div></section></main><script src="js/script.js"></script></body></html>
